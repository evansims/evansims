<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Share card</title>
        <style>
            @font-face {
                font-family: "Newsreader";
                src: url("../assets/fonts/newsreader-latin-roman.woff2") format("woff2");
                font-weight: 200 800;
                font-style: normal;
            }
            @font-face {
                font-family: "Newsreader";
                src: url("../assets/fonts/newsreader-latin-italic.woff2") format("woff2");
                font-weight: 200 800;
                font-style: italic;
            }
            * { box-sizing: border-box; margin: 0; }
            html, body { width: 1200px; height: 630px; }
            body {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 72px 80px 64px;
                background: #f5f1e8;
                color: #1c1a16;
                font-family: "Newsreader", Georgia, serif;
                -webkit-font-smoothing: antialiased;
            }
            .label {
                color: #b23a1c;
                font: 600 20px/1 system-ui, -apple-system, sans-serif;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }
            h1 {
                max-width: 960px;
                margin-top: 28px;
                font-size: 76px;
                font-weight: 400;
                line-height: 1.04;
                letter-spacing: -0.022em;
            }
            h1 em { color: #b23a1c; }
            .foot {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                padding-top: 24px;
                border-top: 1px solid #d8d1c1;
                font-size: 32px;
            }
            .foot span:last-child {
                color: #6b6558;
                font: 500 22px/1 system-ui, -apple-system, sans-serif;
            }
        </style>
    </head>
    <body>
        <div>
            <p class="label">Co-founder &amp; CTO, InferaDB</p>
            <h1>Authorization at scale is a <em>database problem</em>. I’m building the database.</h1>
        </div>
        <div class="foot"><span>Evan Sims</span><span>evansims.com</span></div>
    </body>
</html>

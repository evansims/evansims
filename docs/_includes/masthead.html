{%- assign email = site.data.socials | where: "site", "Email" | first -%}
<header class="mast">
    <a class="name" href="/">{{ site.title }}</a>
    <nav aria-label="Primary">
        <a href="/writing"{% if page.url == "/writing" %} aria-current="page"{% elsif page.collection == "essays" %} aria-current="true"{% endif %}>Writing</a>
        <a href="/talks"{% if page.url == "/talks" %} aria-current="page"{% endif %}>Talks</a>
        <a href="{{ email.link }}">Contact</a>
        <button class="theme" type="button" aria-label="Switch color theme" hidden>
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <circle cx="9" cy="9" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5" />
                <path d="M9 1.75a7.25 7.25 0 0 1 0 14.5z" fill="currentColor" />
            </svg>
        </button>
    </nav>
</header>
